# Used by `aso start-hub --docker`, which sets these variables. To run it by hand:
#   ASO_PROJECTS_ROOT=~/aso-projects ASO_TOKEN=... ASO_DB_PASSWORD=$(cat ~/.config/aso/db-password) \
#   ASO_UID=$(id -u) ASO_GID=$(id -g) docker compose up --build
name: aso
services:
  # The Hub's database: tasks, plans, agent conversations. Not published: only the Hub reaches it.
  # Its data is in the aso-db volume; the password is set when that volume is first created.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aso
      POSTGRES_DB: aso
      POSTGRES_PASSWORD: "${ASO_DB_PASSWORD:?the CLI passes the database password}"
    volumes:
      - aso-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aso -d aso"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  hub:
    build:
      context: .
      args:
        ASO_BUILD: "${ASO_BUILD:-unknown}"
    image: aso-hub:local
    init: true
    user: "${ASO_UID:-1000}:${ASO_GID:-1000}"
    ports:
      - "${ASO_BIND:-0.0.0.0}:${ASO_HUB_PORT:-7420}:7420"
      - "${ASO_BIND:-0.0.0.0}:${ASO_DASHBOARD_PORT:-7421}:7421"
      # The worker gateway, for a TLS tunnel on this machine (Tailscale Funnel): never on other interfaces.
      - "127.0.0.1:${ASO_GATEWAY_PORT:-7423}:7423"
    volumes:
      # The projects folder: each git repository in it is a project.
      - "${ASO_PROJECTS_ROOT:?set ASO_PROJECTS_ROOT to the projects folder}:/projects"
      - aso-data:/data
    environment:
      ASO_LOG_LEVEL: "${ASO_LOG_LEVEL:-info}"
      ASO_PROJECTS_ROOT_DISPLAY: "${ASO_PROJECTS_ROOT:-}"
      ASO_TEST_COMMAND: "${ASO_TEST_COMMAND:-npm test}"
      ASO_QA: "${ASO_QA:-1}"
      ASO_ACCEPTANCE_CHECK: "${ASO_ACCEPTANCE_CHECK:-1}"
      ASO_AUTO_UPDATE: "${ASO_AUTO_UPDATE:-1}"
      ASO_PULL_REQUESTS: "${ASO_PULL_REQUESTS:-1}"
      ASO_ALLOW_DEPS: "${ASO_ALLOW_DEPS:-}"
      ASO_CONSOLE_URL: "${ASO_CONSOLE_URL:-}"
      # Empty: Claude Opus when Anthropic is a provider; otherwise the Hub asks for --model.
      ASO_MODEL: "${ASO_MODEL:-}"
      ASO_AGENT_MODEL: "${ASO_AGENT_MODEL:-}"
      ASO_EFFORT: "${ASO_EFFORT:-high}"
      ASO_TASK_BUDGET: "${ASO_TASK_BUDGET:-5}"
      ASO_PLAN_BUDGET: "${ASO_PLAN_BUDGET:-3}"
      ASO_MAX_TURNS: "${ASO_MAX_TURNS:-80}"
      ASO_LLM_CONCURRENCY: "${ASO_LLM_CONCURRENCY:-4}"
      # A failing task moves to stronger models (docs/models.md, "Escalation").
      ASO_ESCALATE_TO: "${ASO_ESCALATE_TO:-}"
      ASO_JUNIOR_TRIES: "${ASO_JUNIOR_TRIES:-2}"
      ASO_ESCALATION: "${ASO_ESCALATION:-1}"
      ASO_DAILY_SPEND_ALERT_USD: "${ASO_DAILY_SPEND_ALERT_USD:-}"
      # `host`: deploy commands are handed to `aso start-hub --docker` on the host (the container has no Docker).
      ASO_DEPLOY_RUNNER: "${ASO_DEPLOY_RUNNER:-}"
      # Set: the worker gateway listens on 7423 in the container (published above).
      ASO_GATEWAY_PORT: "${ASO_GATEWAY_PORT:+7423}"
      ASO_GATEWAY_HOST: "0.0.0.0"
      ASO_GATEWAY_URL: "${ASO_GATEWAY_URL:-}"
      ASO_AUTO_MERGE_SYNCS: "${ASO_AUTO_MERGE_SYNCS:-1}"
      # Share the swarm's track record publicly (--public-stats); empty: not shared.
      ASO_PUBLIC_STATS: "${ASO_PUBLIC_STATS:-}"
      ASO_PUBLIC_STATS_PROJECTS: "${ASO_PUBLIC_STATS_PROJECTS:-}"
      # The db service above, unless the CLI was given a database of its own (--database-url).
      ASO_DATABASE_URL: "${ASO_DATABASE_URL:-postgres://aso:${ASO_DB_PASSWORD}@db:5432/aso}"
      # Read from the environment of `aso start-hub --docker`; never baked into the image.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Cloud providers' keys: each makes that provider available (docs/models.md, "Providers").
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      # One OpenAI-compatible API (e.g. Ollama), as the provider `local`.
      ASO_LLM_BASE_URL: "${ASO_LLM_BASE_URL:-}"
      ASO_LLM_API_KEY: "${ASO_LLM_API_KEY:-}"
      ASO_LLM_VISION: "${ASO_LLM_VISION:-}"
      ASO_TOKEN: "${ASO_TOKEN:?the CLI passes the Hub token}"
      ASO_PUSH: "${ASO_PUSH:-1}"
      # For HTTPS remotes (e.g. a GitHub fine-grained token with Contents: read/write).
      ASO_GIT_TOKEN: "${ASO_GIT_TOKEN:-}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aso-data:
  aso-db:
